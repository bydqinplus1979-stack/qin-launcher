name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/qin/launcher
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'QinLauncher'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.qin.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.qin.launcher'
                  minSdk 28
                  targetSdk 28
                  versionCode 1
                  versionName '0.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <application android:label="Qin Launcher" android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".ScanActivity" android:exported="false"/>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/qin/launcher/MainActivity.java <<'EOF'
          package com.qin.launcher;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.GridView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity implements LocationListener {
              TextView clockView, speedView;
              Handler handler = new Handler(Looper.getMainLooper());
              Runnable tick = new Runnable() {
                  public void run() {
                      clockView.setText(new SimpleDateFormat("HH:mm", Locale.US).format(new Date()));
                      handler.postDelayed(this, 1000);
                  }
              };

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor("#0B1220"));
                  root.setPadding(32, 24, 32, 24);

                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.HORIZONTAL);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  clockView = new TextView(this);
                  clockView.setTextSize(40);
                  clockView.setTextColor(Color.WHITE);
                  speedView = new TextView(this);
                  speedView.setTextSize(40);
                  speedView.setTextColor(Color.parseColor("#2DD4BF"));
                  speedView.setText("-- km/h");
                  speedView.setGravity(Gravity.CENTER);
                  Button scan = new Button(this);
                  scan.setText("فحص واجهات السيارة (BYD)");
                  scan.setOnClickListener(v -> startActivity(new Intent(this, ScanActivity.class)));
                  top.addView(clockView, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));
                  top.addView(speedView, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));
                  top.addView(scan, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));
                  root.addView(top);

                  final PackageManager pm = getPackageManager();
                  Intent q = new Intent(Intent.ACTION_MAIN);
                  q.addCategory(Intent.CATEGORY_LAUNCHER);
                  final List<ResolveInfo> apps = new ArrayList<>(pm.queryIntentActivities(q, 0));
                  Collections.sort(apps, (a, c) -> a.loadLabel(pm).toString().compareToIgnoreCase(c.loadLabel(pm).toString()));

                  GridView grid = new GridView(this);
                  grid.setNumColumns(5);
                  grid.setVerticalSpacing(24);
                  grid.setAdapter(new ArrayAdapter<ResolveInfo>(this, 0, apps) {
                      @Override
                      public View getView(int pos, View v, ViewGroup parent) {
                          ResolveInfo ri = apps.get(pos);
                          LinearLayout cell = new LinearLayout(MainActivity.this);
                          cell.setOrientation(LinearLayout.VERTICAL);
                          cell.setGravity(Gravity.CENTER);
                          ImageView icon = new ImageView(MainActivity.this);
                          icon.setImageDrawable(ri.loadIcon(pm));
                          cell.addView(icon, new LinearLayout.LayoutParams(110, 110));
                          TextView t = new TextView(MainActivity.this);
                          t.setText(ri.loadLabel(pm));
                          t.setTextColor(Color.WHITE);
                          t.setTextSize(14);
                          t.setGravity(Gravity.CENTER);
                          t.setMaxLines(1);
                          cell.addView(t);
                          return cell;
                      }
                  });
                  grid.setOnItemClickListener((p, v, pos, id) -> {
                      ResolveInfo ri = apps.get(pos);
                      Intent li = pm.getLaunchIntentForPackage(ri.activityInfo.packageName);
                      if (li != null) startActivity(li);
                  });
                  root.addView(grid, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1));
                  setContentView(root);

                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, 1);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  handler.post(tick);
                  startGps();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  handler.removeCallbacks(tick);
                  try {
                      ((LocationManager) getSystemService(Context.LOCATION_SERVICE)).removeUpdates(this);
                  } catch (Throwable ignored) { }
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  startGps();
              }

              void startGps() {
                  try {
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                          ((LocationManager) getSystemService(Context.LOCATION_SERVICE))
                                  .requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000, 0, this);
                      }
                  } catch (Throwable ignored) { }
              }

              @Override
              public void onLocationChanged(Location l) {
                  speedView.setText(Math.round(l.getSpeed() * 3.6f) + " km/h");
              }

              @Override
              public void onStatusChanged(String p, int s, Bundle e) { }

              @Override
              public void onProviderEnabled(String p) { }

              @Override
              public void onProviderDisabled(String p) { }
          }
          EOF
          cat > app/src/main/java/com/qin/launcher/ScanActivity.java <<'EOF'
          package com.qin.launcher;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import dalvik.system.DexFile;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileWriter;
          import java.io.InputStream;
          import java.lang.reflect.Method;
          import java.util.Enumeration;
          import java.util.TreeSet;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipFile;

          public class ScanActivity extends Activity {
              TextView out;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  ScrollView sv = new ScrollView(this);
                  out = new TextView(this);
                  out.setTextIsSelectable(true);
                  out.setTextSize(14);
                  out.setPadding(24, 24, 24, 24);
                  out.setText("جارٍ الفحص... قد يستغرق دقيقة");
                  sv.addView(out);
                  setContentView(sv);
                  new Thread(() -> {
                      String r;
                      try {
                          r = scan();
                      } catch (Throwable t) {
                          r = "خطأ: " + t;
                      }
                      final String f = r;
                      runOnUiThread(() -> out.setText(f));
                      try {
                          FileWriter w = new FileWriter(new File(getExternalFilesDir(null), "scan.txt"));
                          w.write(f);
                          w.close();
                      } catch (Throwable ignored) { }
                  }).start();
              }

              String scan() throws Exception {
                  TreeSet<String> names = new TreeSet<>();
                  Pattern p = Pattern.compile("Landroid/hardware/bydauto/[A-Za-z0-9_/$]+;");
                  File[] files = new File("/system/framework").listFiles();
                  StringBuilder sb = new StringBuilder();
                  if (files == null) return "تعذر قراءة /system/framework";
                  for (File f : files) {
                      if (!f.getName().endsWith(".jar")) continue;
                      try (ZipFile z = new ZipFile(f)) {
                          Enumeration<? extends ZipEntry> en = z.entries();
                          while (en.hasMoreElements()) {
                              ZipEntry e = en.nextElement();
                              if (!e.getName().endsWith(".dex")) continue;
                              InputStream in = z.getInputStream(e);
                              ByteArrayOutputStream bo = new ByteArrayOutputStream();
                              byte[] buf = new byte[65536];
                              int n;
                              while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                              in.close();
                              Matcher m = p.matcher(new String(bo.toByteArray(), "ISO-8859-1"));
                              while (m.find()) {
                                  String d = m.group();
                                  names.add(d.substring(1, d.length() - 1).replace('/', '.'));
                              }
                          }
                      } catch (Throwable ignored) { }
                  }
                  if (names.isEmpty()) {
                      for (File f : files) {
                          if (!f.getName().endsWith(".jar")) continue;
                          try {
                              DexFile df = new DexFile(f.getPath());
                              Enumeration<String> en = df.entries();
                              while (en.hasMoreElements()) {
                                  String s = en.nextElement();
                                  if (s.toLowerCase().contains("bydauto")) names.add(s);
                              }
                          } catch (Throwable ignored) { }
                      }
                  }
                  sb.append("عدد الأصناف المكتشفة: ").append(names.size()).append("\n\n");
                  for (String n : names) sb.append(n).append("\n");
                  sb.append("\n===== الدوال العامة في أصناف Device =====\n");
                  for (String n : names) {
                      if (!n.endsWith("Device") || n.contains("$")) continue;
                      try {
                          Class<?> c = Class.forName(n, false, getClassLoader());
                          sb.append("\n[").append(n.substring(n.lastIndexOf('.') + 1)).append("]\n");
                          for (Method mt : c.getDeclaredMethods()) {
                              if (!java.lang.reflect.Modifier.isPublic(mt.getModifiers())) continue;
                              sb.append("  ").append(mt.getReturnType().getSimpleName()).append(" ")
                                .append(mt.getName()).append("(");
                              Class<?>[] pt = mt.getParameterTypes();
                              for (int i = 0; i < pt.length; i++) {
                                  if (i > 0) sb.append(", ");
                                  sb.append(pt[i].getSimpleName());
                              }
                              sb.append(")\n");
                          }
                      } catch (Throwable t) {
                          sb.append("  (تعذر التحميل: ").append(t.getClass().getSimpleName()).append(")\n");
                      }
                      if (sb.length() > 80000) { sb.append("\n...اقتُطع..."); break; }
                  }
                  return sb.toString();
              }
          }
          EOF
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: QinLauncher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
