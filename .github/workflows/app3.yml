name: Build APK v3
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/qin/launcher
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'QinLauncher'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.qin.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.qin.launcher'
                  minSdk 28
                  targetSdk 28
                  versionCode 1
                  versionName '0.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.BYDAUTO_AC_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_BODYWORK_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_TYRE_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_ENERGY_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_CHARGING_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_ENGINE_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_GEARBOX_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_SPEED_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_PM2P5_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_STATISTIC_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_SETTING_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_LIGHT_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_WIPER_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_PANORAMA_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_SENSOR_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_MOTOR_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_LOCATION_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_DOORLOCK_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_INSTRUMENT_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_SAFETYBELT_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_RADAR_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_SECURITY_GET"/>
              <uses-permission android:name="android.permission.BYDAUTO_OTA_GET"/>
              <application android:label="Qin Launcher" android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".ScanActivity" android:exported="false"/>
                  <activity android:name=".ProbeActivity" android:exported="false"/>
              </application>
          </manifest>
          EOF
          cp *.java app/src/main/java/com/qin/launcher/
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: QinLauncher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
