name: Build APK v8
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/qin/launcher
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'QinLauncher'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.qin.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.qin.launcher'
                  minSdk 28
                  targetSdk 28
                  versionCode 8
                  versionName '0.8'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          M=app/src/main/AndroidManifest.xml
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
            echo '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>'
            echo '<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>'
            echo '<uses-permission android:name="com.byd.permission.carstatus.READ_PROVIDER"/>'
            for p in $(cat perms.txt); do
              echo "<uses-permission android:name=\"android.permission.BYDAUTO_${p}_COMMON\"/>"
            done
            echo '<application android:label="Aldarawsheh Launcher" android:largeHeap="true" android:theme="@android:style/Theme.Material.NoActionBar">'
            echo '<activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>'
            echo '<activity android:name=".ScanActivity" android:exported="false"/>'
            echo '<activity android:name=".ProbeActivity" android:exported="false"/>'
            echo '<activity android:name=".ProviderTestActivity" android:exported="false"/>'
            echo '</application></manifest>'
          } > $M
          echo "----- MANIFEST -----"
          cat $M
          echo "----- JAVA FILES -----"
          ls -la *.java
          cp *.java app/src/main/java/com/qin/launcher/
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: QinLauncher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
